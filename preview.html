    const openExternalUrl = (url) => {
      if (!url) return;
      try {
        window.location.href = url;
      } catch (err) {
        window.open(url, '_blank');
      }
    };

    // Live Link Metadata & AI Analyzer
    const analyzeUrlWithFreeAPI = async (url, aiConf) => {
      let title = '';
      let description = '';
      let author = '';
      let platform = 'Web';
      let image = '';

      const u = url.toLowerCase();
      if (u.includes('youtube') || u.includes('youtu.be')) platform = 'YouTube';
      else if (u.includes('instagram')) platform = 'Instagram';
      else if (u.includes('tiktok')) platform = 'TikTok';
      else if (u.includes('threads.net')) platform = 'Threads';
      else if (u.includes('twitter') || u.includes('x.com')) platform = 'X';
      else if (u.includes('t.me')) platform = 'Telegram';

      // 1. Fetch live OpenGraph metadata from the real URL via free Microlink API
      try {
        const metaRes = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}&screenshot=false`, {
          signal: AbortSignal.timeout(6000)
        });
        if (metaRes.ok) {
          const metaData = await metaRes.json();
          if (metaData.status === 'success' && metaData.data) {
            const d = metaData.data;
            if (d.title) title = d.title;
            if (d.description) description = d.description;
            if (d.publisher) platform = d.publisher;
            if (d.author) author = d.author;
            if (d.image?.url) image = d.image.url;
          }
        }
      } catch (e) {
        console.log('Direct metadata note:', e.message);
      }

      // 2. If user configured an LLM key (Gemma or Gemini), run deep contextual AI summary
      if (aiConf.apiKey && aiConf.apiKey.trim()) {
        try {
          const systemPrompt = "Ты персональный AI-ассистент менеджера закладок. Твоя задача — извлечь максимум пользы из предоставленной ссылки/материала. Отвечай строго валидным JSON без markdown разметки.";
          const userPrompt = `Ссылка: "${url}". Информация со страницы: Заголовок: "${title}", Описание: "${description}". Сформируй JSON объект: {"title": "краткий емкий заголовок на русском", "summary": "емкая выжимка сути и пользы из 1-2 предложений на русском", "tags": ["тег1", "тег2", "тег3"], "platform": "${platform}"}`;

          if (aiConf.provider === 'gemini') {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${aiConf.model || 'gemini-1.5-flash'}:generateContent?key=${aiConf.apiKey.trim()}`;
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: `${systemPrompt}\n\n${userPrompt}` }] }],
                generationConfig: { responseMimeType: "application/json" }
              })
            });
            if (res.ok) {
              const data = await res.json();
              const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
              const parsed = JSON.parse(text);
              return {
                title: parsed.title || title || `Публикация из ${platform}`,
                summary: parsed.summary || description || 'Материал успешно сохранён в архив.',
                tags: parsed.tags && parsed.tags.length ? parsed.tags : [platform, 'Закладки'],
                platform: parsed.platform || platform,
                image: image
              };
            }
          } else {
            // Groq Gemma / Custom
            const endpoint = aiConf.provider === 'groq'
              ? 'https://api.groq.com/openai/v1/chat/completions'
              : (aiConf.customEndpoint || 'https://openrouter.ai/api/v1/chat/completions');

            const chosenModel = aiConf.provider === 'groq' ? (aiConf.model || 'gemma2-9b-it') : aiConf.model;

            const res = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${aiConf.apiKey.trim()}`
              },
              body: JSON.stringify({
                model: chosenModel,
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: userPrompt }
                ],
                response_format: { type: "json_object" }
              })
            });
            if (res.ok) {
              const data = await res.json();
              const parsed = JSON.parse(data.choices?.[0]?.message?.content);
              return {
                title: parsed.title || title || `Публикация из ${platform}`,
                summary: parsed.summary || description || 'Материал успешно сохранён в архив.',
                tags: parsed.tags && parsed.tags.length ? parsed.tags : [platform, 'Закладки'],
                platform: parsed.platform || platform,
                image: image
              };
            }
          }
        } catch (err) {
          console.warn('LLM error:', err);
        }
      }

      // 3. Built-in Free AI Synthesizer (Zero-key fallback, uses live page data)
      if (description) {
        const cleanDesc = description.trim();
        const summary = cleanDesc.length > 200 ? cleanDesc.slice(0, 197) + '...' : cleanDesc;
        return {
          title: title || `Публикация из ${platform}`,
          summary: summary,
          tags: [platform, 'Интересное', 'Сохранённое'],
          platform: platform,
          image: image
        };
      }

      return {
        title: title || `Публикация из ${platform}`,
        summary: `Материал сохранён из ${platform}. Нажмите «Открыть», чтобы перейти к полному контенту.`,
        tags: [platform, 'Закладки'],
        platform: platform,
        image: image
      };
    };

    function App() {
      // Bookmarks State with LocalStorage
      const [items, setItems] = useState(() => loadStorage('sv_items_v3', INITIAL_ITEMS));
      useEffect(() => { saveStorage('sv_items_v3', items); }, [items]);

      // Categories State with Clean Default (Only "Все")
      const [collections, setCollections] = useState(() => loadStorage('sv_collections_clean_v3', DEFAULT_COLLECTIONS_DATA));
      useEffect(() => { saveStorage('sv_collections_clean_v3', collections); }, [collections]);

      // AI Settings State with LocalStorage
      const [aiConfig, setAiConfig] = useState(() => loadStorage('sv_ai_config_v3', {
        provider: 'groq',
        apiKey: '',
        model: 'gemma2-9b-it',
        customEndpoint: ''
      }));
      useEffect(() => { saveStorage('sv_ai_config_v3', aiConfig); }, [aiConfig]);

      const [searchQuery, setSearchQuery] = useState('');
      const [activeType, setActiveType] = useState('all');
      const [activeCollection, setActiveCollection] = useState('all');
      const [urlInput, setUrlInput] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      const [aiStatusMsg, setAiStatusMsg] = useState('');
      const [aiPreview, setAiPreview] = useState(null);
      const [activeSummaryId, setActiveSummaryId] = useState(null);

      // Category Management Modals
      const [isManagingCategories, setIsManagingCategories] = useState(false);
      const [newCategoryName, setNewCategoryName] = useState('');
      const [selectedIconId, setSelectedIconId] = useState('Rocket');

      // Custom In-App Deletion Confirmation Modal
      const [categoryToDelete, setCategoryToDelete] = useState(null); // { id, name }

      // AI Settings Modal
      const [isAiSettingsOpen, setIsAiSettingsOpen] = useState(false);
      const [tempAiConfig, setTempAiConfig] = useState(aiConfig);
      const [testApiStatus, setTestApiStatus] = useState(null);
      const [testApiMsg, setTestApiMsg] = useState('');

      const openAiSettings = () => {
        setTempAiConfig(aiConfig);
        setTestApiStatus(null);
        setTestApiMsg('');
        setIsAiSettingsOpen(true);
      };

      const getCategoryIconComp = (iconId) => {
        const found = AVAILABLE_ICONS.find(i => i.id === iconId);
        if (found && typeof found.Comp === 'function') return found.Comp;
        if (Icons[iconId] && typeof Icons[iconId] === 'function') return Icons[iconId];
        return Icons.Folder;
      };

      const getCategoryInfo = (collectionId) => {
        if (!collectionId || collectionId === 'all') {
          return { name: 'Не сортировано', isAssigned: false, Icon: Icons.Folder };
        }
        const found = collections.find(c => c.id === collectionId);
        if (found) {
          return { name: found.name, isAssigned: true, Icon: getCategoryIconComp(found.iconId) };
        }
        return { name: 'Не сортировано', isAssigned: false, Icon: Icons.Folder };
      };

      // Add New Category
      const handleCreateCategory = (e) => {
        e.preventDefault();
        if (!newCategoryName.trim()) return;

        const newCat = {
          id: `cat_${Date.now()}`,
          name: newCategoryName.trim(),
          iconId: selectedIconId
        };

        const updated = [...collections, newCat];
        setCollections(updated);
        setActiveCollection(newCat.id);
        setNewCategoryName('');
      };

      // Trigger In-App Delete Modal
      const requestDeleteCategory = (catId, catName) => {
        if (catId === 'all') return;
        setCategoryToDelete({ id: catId, name: catName });
      };

      // Execute Delete Category Action
      const executeDeleteCategory = (catId) => {
        const updatedItems = items.map(it => it.collectionId === catId ? { ...it, collectionId: null } : it);
        setItems(updatedItems);

        const updatedCollections = collections.filter(c => c.id !== catId);
        setCollections(updatedCollections);

        if (activeCollection === catId) {
          setActiveCollection('all');
        }
        setCategoryToDelete(null);
      };

      // Test AI API Connection
      const handleTestApi = async () => {
        setTestApiStatus('testing');
        setTestApiMsg('Проверка соединения с моделью...');
        try {
          const testRes = await analyzeUrlWithFreeAPI('https://youtube.com/watch?v=pasta_carbonara', tempAiConfig);
          if (testRes && testRes.title) {
            setTestApiStatus('success');
            setTestApiMsg(`✓ Связь с ${tempAiConfig.provider.toUpperCase()} (${tempAiConfig.model}) успешно проверена!`);
          } else {
            throw new Error('Пустой ответ');
          }
        } catch (err) {
          setTestApiStatus('error');
          setTestApiMsg(`✕ ${err.message || 'Ошибка подключения'}`);
        }
      };

      const handleSaveAiConfig = (e) => {
        e.preventDefault();
        setAiConfig(tempAiConfig);
        setIsAiSettingsOpen(false);
      };

      // Handle Adding URL with Live Free AI Analyzer
      const handleAddUrl = async () => {
        if (!urlInput.trim()) return;
        setIsProcessing(true);
        setAiStatusMsg(aiConfig.apiKey ? `Анализирую контент через ${aiConfig.model}...` : 'Извлекаю данные и AI-выжимку по ссылке...');

        try {
          const analyzed = await analyzeUrlWithFreeAPI(urlInput, aiConfig);

          let detectedType = (analyzed.platform === 'YouTube' || analyzed.platform === 'TikTok') ? 'video'
                           : (analyzed.platform === 'Threads' || analyzed.platform === 'X') ? 'thread'
                           : 'article';

          setAiPreview({
            id: String(Date.now()),
            url: urlInput,
            title: analyzed.title,
            description: analyzed.summary,
            author: `@${analyzed.platform.toLowerCase()}_source`,
            platform: analyzed.platform,
            thumbnailUrl: analyzed.image || 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600&auto=format&fit=crop&q=80',
            aiSummary: analyzed.summary,
            contentType: detectedType,
            isPinned: false,
            savedAt: 'Только что',
            tags: analyzed.tags,
            collectionId: activeCollection !== 'all' ? activeCollection : null
          });
        } catch (err) {
          console.error(err);
        }

        setIsProcessing(false);
      };

      const confirmSave = () => {
        if (!aiPreview) return;
        setItems([aiPreview, ...items]);
        setAiPreview(null);
        setUrlInput('');
      };

      const togglePin = (id) => {
        setItems(items.map(it => it.id === id ? { ...it, isPinned: !it.isPinned } : it));
      };

      const deleteItem = (id) => {
        setItems(items.filter(it => it.id !== id));
      };

      const filteredItems = useMemo(() => {
        return items.filter(it => {
          if (activeCollection !== 'all' && it.collectionId !== activeCollection) return false;
          if (activeType !== 'all' && it.contentType !== activeType) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const fullText = `${it.title} ${it.description} ${it.aiSummary} ${it.tags.join(' ')} ${it.author}`.toLowerCase();
            return fullText.includes(q);
          }
          return true;
        }).sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));
      }, [items, activeCollection, activeType, searchQuery]);

      return (
        <div className="min-h-screen bg-black text-white flex flex-col pb-16 w-full max-w-full overflow-x-hidden">
          
          {/* iOS Top Navigation Bar */}
          <header className="sticky top-0 z-30 ios-glass border-b border-white/[0.08] w-full">
            <div className="w-full max-w-5xl mx-auto px-4 pt-3 pb-2 flex flex-col gap-2.5">
              
              {/* Row 1: Logo, AI Settings Button & Count */}
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-[10px] bg-gradient-to-br from-[#0A84FF] to-[#0051D5] flex items-center justify-center text-white shadow-md shadow-[#0A84FF]/25 flex-shrink-0">
                    <Icons.Bookmark className="w-4 h-4 fill-current" />
                  </div>
                  <div className="flex flex-col">
                    <h1 className="text-[16px] font-bold tracking-tight leading-tight text-white">Мои закладки</h1>
                    <span className="text-[10px] text-[#8E8E93] font-medium flex items-center gap-1">
                      {aiConfig.apiKey ? (
                        <>
                          <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                          <span className="text-emerald-400 font-medium">{aiConfig.model}</span>
                        </>
                      ) : (
                        <span>Бесплатный AI-анализ</span>
                      )}
                    </span>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  {/* AI Settings Button */}
                  <button
                    onClick={openAiSettings}
                    className={`px-2.5 py-1.5 rounded-[10px] text-[11px] font-medium transition-all flex items-center gap-1.5 border ${
                      aiConfig.apiKey
                        ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20'
                        : 'bg-[#0A84FF]/10 border-[#0A84FF]/30 text-[#0A84FF] hover:bg-[#0A84FF]/20'
                    }`}
                    title="Настройки ИИ API (Gemma / Gemini)"
                  >
                    <Icons.Sparkles className="w-3.5 h-3.5" />
                    <span>{aiConfig.apiKey ? 'ИИ активен' : 'ИИ API'}</span>
                  </button>

                  {/* Bookmark Count Badge */}
                  <div className="flex items-center gap-1 px-2.5 py-1 rounded-full bg-white/[0.06] text-[11px] text-[#8E8E93] font-medium border border-white/[0.05]">
                    <span>{filteredItems.length}</span>
                  </div>
                </div>
              </div>

              {/* Row 2: Full-Width Mobile Spotlight Search */}
              <div className="relative w-full">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Поиск по смыслу, темам или тегам..."
                  className="w-full h-9 pl-9 pr-8 rounded-[12px] bg-[#1C1C1E] text-[13px] text-white placeholder-[#8E8E93] focus:outline-none focus:ring-2 focus:ring-[#0A84FF]/50 border border-white/[0.08] transition-all"
                />
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-[#8E8E93]">
                  <Icons.Search className="w-3.5 h-3.5" />
                </span>
                {searchQuery && (
                  <button
                    onClick={() => setSearchQuery('')}
                    className="absolute right-2.5 top-1/2 -translate-y-1/2 text-[#8E8E93] hover:text-white p-1"
                  >
                    <Icons.Close className="w-3 h-3" />
                  </button>
                )}
              </div>
            </div>

            {/* Row 3: Horizontal Scrollable Categories Bar (Clean Start!) */}
            <div className="w-full border-t border-white/[0.04]">
              <div className="w-full max-w-5xl mx-auto px-4 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar">
                {collections.map(col => {
                  const CategoryIcon = getCategoryIconComp(col.iconId);
                  const isActive = activeCollection === col.id;

                  return (
                    <div key={col.id} className="relative flex items-center flex-shrink-0">
                      <button
                        onClick={() => setActiveCollection(col.id)}
                        className={`px-3 py-1.5 rounded-[10px] text-[12px] font-medium transition-all whitespace-nowrap flex items-center gap-1.5 ${
                          isActive
                            ? `bg-[#0A84FF] text-white shadow-sm ${col.id !== 'all' ? 'pr-7' : ''}`
                            : 'bg-[#1C1C1E] text-[#8E8E93] hover:text-white border border-white/[0.04]'
                        }`}
                      >
                        <span className={isActive ? 'text-white' : 'text-[#8E8E93]'}>
                          <CategoryIcon className="w-3 h-3" />
                        </span>
                        <span>{col.name}</span>
                      </button>

                      {/* Quick Delete Category Button (Visible on active custom category) */}
                      {isActive && col.id !== 'all' && (
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            requestDeleteCategory(col.id, col.name);
                          }}
                          className="absolute right-1.5 top-1/2 -translate-y-1/2 p-1 rounded-full text-white/80 hover:text-rose-400 hover:bg-black/40 transition-colors"
                          title="Удалить категорию"
                        >
                          <Icons.Close className="w-3 h-3" />
                        </button>
                      )}
                    </div>
                  );
                })}

                {/* Manage / Add Categories Button */}
                <button
                  onClick={() => setIsManagingCategories(true)}
                  className="px-2.5 py-1.5 rounded-[10px] text-[12px] font-medium text-[#0A84FF] bg-[#0A84FF]/10 hover:bg-[#0A84FF]/20 transition-all flex items-center gap-1 border border-[#0A84FF]/30 flex-shrink-0 whitespace-nowrap"
                  title="Создать и управлять категориями"
                >
                  <Icons.Plus className="w-3 h-3" />
                  <span>Категория</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main View Area */}
          <main className="w-full max-w-5xl mx-auto px-4 pt-4 flex-1">
            
            {/* iOS Link Addition Bar */}
            <div className="mb-4 w-full">
              <div className="w-full bg-[#1C1C1E] border border-white/[0.08] rounded-[16px] p-2 flex items-center gap-2 shadow-sm">
                <div className="w-7 h-7 rounded-[8px] bg-[#0A84FF]/15 text-[#0A84FF] flex items-center justify-center flex-shrink-0">
                  <Icons.Bookmark className="w-3.5 h-3.5 fill-current" />
                </div>
                <input
                  type="url"
                  value={urlInput}
                  onChange={(e) => setUrlInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleAddUrl()}
                  placeholder="Вставьте ссылку на любой пост..."
                  className="flex-1 min-w-0 bg-transparent text-[13px] text-white placeholder-[#8E8E93] outline-none px-1"
                  disabled={isProcessing}
                />
                <button
                  onClick={handleAddUrl}
                  disabled={isProcessing || !urlInput.trim()}
                  className="h-7 px-3 rounded-[9px] bg-[#0A84FF] hover:bg-[#0071E3] disabled:opacity-40 text-white text-[12px] font-semibold transition-all flex items-center gap-1 flex-shrink-0 active:scale-95 shadow-sm"
                >
                  {isProcessing ? (
                    <span className="flex items-center gap-1">
                      <span className="animate-spin text-[10px]">✦</span> ИИ...
                    </span>
                  ) : (
                    <span>Сохранить</span>
                  )}
                </button>
              </div>

              {/* Real-time Processing Indicator */}
              {isProcessing && (
                <div className="text-[11px] text-[#0A84FF] mt-1.5 px-2 flex items-center gap-1.5 animate-pulse">
                  <Icons.Sparkles className="w-3 h-3" />
                  <span>{aiStatusMsg}</span>
                </div>
              )}

              {/* Apple Intelligence Preview Sheet */}
              {aiPreview && (
                <div className="w-full mt-3 ios-card p-3.5 border-[#0A84FF]/40 bg-[#0A84FF]/[0.06] animate-fade-in">
                  <div className="flex items-center justify-between mb-2.5">
                    <span className="text-[11px] font-semibold text-[#0A84FF] flex items-center gap-1.5">
                      <Icons.Sparkles className="w-3 h-3 text-[#0A84FF]" />
                      <span>Анализ ссылки завершён</span>
                    </span>
                    <button onClick={() => setAiPreview(null)} className="text-[#8E8E93] hover:text-white p-1">
                      <Icons.Close className="w-3 h-3" />
                    </button>
                  </div>

                  <div className="flex gap-3 items-start">
                    <img src={aiPreview.thumbnailUrl} alt="" className="w-20 h-16 object-cover rounded-[12px] shadow-sm flex-shrink-0" />
                    <div className="flex-1 min-w-0">
                      <h4 className="font-semibold text-[13px] leading-snug line-clamp-2 text-white">{aiPreview.title}</h4>
                      <div className="flex items-center gap-1.5 mt-1.5 flex-wrap">
                        <span className="text-[10px] text-[#0A84FF] font-semibold bg-[#0A84FF]/20 px-2 py-0.5 rounded-full">
                          {aiPreview.platform}
                        </span>
                        {aiPreview.tags.map(t => (
                          <span key={t} className="text-[10px] text-[#8E8E93] bg-white/[0.06] px-1.5 py-0.5 rounded-full">
                            #{t}
                          </span>
                        ))}
                      </div>
                      <p className="text-[11px] text-[#8E8E93] mt-2 p-2 rounded-[10px] bg-black/40 border border-white/[0.04] leading-relaxed">
                        {aiPreview.aiSummary}
                      </p>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 mt-3 pt-2.5 border-t border-white/[0.08]">
                    <button
                      onClick={() => setAiPreview(null)}
                      className="px-3 py-1.5 rounded-[8px] text-[11px] font-medium text-[#8E8E93] hover:text-white"
                    >
                      Отмена
                    </button>
                    <button
                      onClick={confirmSave}
                      className="px-3.5 py-1.5 rounded-[8px] bg-[#0A84FF] text-white text-[11px] font-semibold shadow-sm hover:bg-[#0071E3] transition-all"
                    >
                      Сохранить в закладки
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* Content Type Filter Pills */}
            <div className="w-full mb-4 flex items-center justify-between gap-2 overflow-x-auto no-scrollbar py-0.5">
              <div className="flex items-center gap-1 p-1 rounded-[12px] bg-[#1C1C1E] border border-white/[0.06] flex-shrink-0">
                {CONTENT_TYPES.map(type => (
                  <button
                    key={type.id}
                    onClick={() => setActiveType(type.id)}
                    className={`px-3 py-1 rounded-[8px] text-[11px] font-medium transition-all ${
                      activeType === type.id
                        ? 'bg-[#2C2C2E] text-white shadow-sm'
                        : 'text-[#8E8E93] hover:text-white'
                    }`}
                  >
                    {type.label}
                  </button>
                ))}
              </div>

              {activeCollection !== 'all' && (
                <button
                  onClick={() => setActiveCollection('all')}
                  className="text-[11px] text-[#0A84FF] hover:underline whitespace-nowrap flex-shrink-0"
                >
                  Все папки
                </button>
              )}
            </div>

            {/* Clean Responsive Cards Grid */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 w-full">
              {filteredItems.map(item => {
                const categoryInfo = getCategoryInfo(item.collectionId);
                const FolderIcon = categoryInfo.Icon;
                const isSummaryOpen = activeSummaryId === item.id;

                return (
                  <div key={item.id} className="ios-card overflow-hidden group flex flex-col w-full">
                    {/* Media Thumbnail (Tap to Open Link!) */}
                    {item.thumbnailUrl && (
                      <div
                        onClick={() => openExternalUrl(item.url)}
                        className="relative aspect-[16/9] w-full overflow-hidden bg-black/40 cursor-pointer"
                        title="Нажмите, чтобы открыть ссылку"
                      >
                        <img
                          src={item.thumbnailUrl}
                          alt=""
                          className="w-full h-full object-cover group-hover:scale-[1.02] transition-transform duration-300"
                          loading="lazy"
                        />

                        {/* Folder Status Pill */}
                        <div className="absolute top-2.5 left-2.5">
                          {categoryInfo.isAssigned ? (
                            <div className="px-2 py-1 rounded-[8px] text-[10px] font-medium bg-black/70 backdrop-blur-md flex items-center gap-1.5 border border-white/10 text-white shadow-sm">
                              <FolderIcon className="w-3 h-3 text-[#0A84FF]" />
                              <span>{categoryInfo.name}</span>
                            </div>
                          ) : (
                            <div className="px-2 py-1 rounded-[8px] text-[10px] font-medium bg-black/70 backdrop-blur-md flex items-center gap-1.5 border border-white/10 text-[#8E8E93] shadow-sm">
                              <Icons.Folder className="w-3 h-3 text-[#8E8E93]" />
                              <span>Не сортировано</span>
                            </div>
                          )}
                        </div>

                        {/* Pinned Star */}
                        {item.isPinned && (
                          <div className="absolute top-2.5 right-2.5 w-6 h-6 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs shadow-md">
                            <Icons.Star className="w-3 h-3 fill-current text-white" />
                          </div>
                        )}
                      </div>
                    )}

                    {/* Card Content Body */}
                    <div className="p-3.5 flex flex-col flex-1">
                      
                      {/* Author & Source */}
                      <div className="flex items-center justify-between mb-1.5 text-[11px] text-[#8E8E93]">
                        <span className="font-medium text-white/80 truncate max-w-[70%]">{item.author}</span>
                        <span className="text-[10px] font-semibold text-[#0A84FF] px-1.5 py-0.5 rounded bg-[#0A84FF]/10">{item.platform}</span>
                      </div>

                      {/* Clickable Title (Tapping opens external link directly) */}
                      <h3
                        onClick={() => openExternalUrl(item.url)}
                        className="text-[15px] font-semibold tracking-tight leading-snug line-clamp-2 mb-2 text-white hover:text-[#0A84FF] active:opacity-75 transition-colors cursor-pointer"
                        title="Открыть публикацию"
                      >
                        {item.title}
                      </h3>

                      {/* AI Summary Pill */}
                      {item.aiSummary && (
                        <div className="mb-2.5">
                          <button
                            onClick={() => setActiveSummaryId(isSummaryOpen ? null : item.id)}
                            className="inline-flex items-center gap-1 text-[11px] font-medium text-[#0A84FF] hover:underline"
                          >
                            <Icons.Sparkles className="w-3 h-3 text-[#0A84FF]" />
                            <span>{isSummaryOpen ? 'Скрыть саммари' : 'AI-Саммари'}</span>
                          </button>
                          {isSummaryOpen && (
                            <div className="mt-1.5 p-2 rounded-[10px] bg-[#0A84FF]/[0.08] border border-[#0A84FF]/20 text-[11px] leading-relaxed text-[#E5E5EA] animate-fade-in">
                              {item.aiSummary}
                            </div>
                          )}
                        </div>
                      )}

                      {/* Tags */}
                      <div className="flex flex-wrap gap-1 mt-auto pt-1">
                        {item.tags.map((tag, i) => (
                          <span
                            key={i}
                            className="px-1.5 py-0.5 rounded-[6px] text-[10px] font-medium bg-white/[0.05] text-[#8E8E93]"
                          >
                            #{tag}
                          </span>
                        ))}
                      </div>

                      {/* Footer Actions: Explicit "Открыть" button */}
                      <div className="flex items-center justify-between pt-2.5 mt-3 border-t border-white/[0.06] text-[11px] text-[#8E8E93]">
                        <span className="flex items-center gap-1 text-[10px]">
                          <Icons.Clock className="w-2.5 h-2.5 text-[#8E8E93]" />
                          <span>{item.savedAt}</span>
                        </span>
                        
                        <div className="flex items-center gap-1.5">
                          <button
                            onClick={() => togglePin(item.id)}
                            className={`p-1.5 rounded-md hover:bg-white/[0.08] transition-colors ${item.isPinned ? 'text-amber-400' : 'text-[#8E8E93] hover:text-white'}`}
                            title={item.isPinned ? 'Открепить' : 'Закрепить'}
                          >
                            <Icons.Star className="w-3.5 h-3.5 fill-current" />
                          </button>
                          
                          {/* Large reliable Open Link Button */}
                          <button
                            onClick={() => openExternalUrl(item.url)}
                            className="px-2.5 py-1 rounded-[8px] bg-[#0A84FF]/15 hover:bg-[#0A84FF] text-[#0A84FF] hover:text-white transition-all flex items-center gap-1 text-[11px] font-semibold active:scale-95"
                            title="Открыть оригинал ссылки"
                          >
                            <span>Открыть</span>
                            <Icons.External className="w-3 h-3" />
                          </button>

                          <button
                            onClick={() => deleteItem(item.id)}
                            className="p-1.5 rounded-md hover:bg-white/[0.08] text-[#8E8E93] hover:text-[#FF453A] transition-colors"
                            title="Удалить"
                          >
                            <Icons.Trash className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </main>

          {/* Modal 1: Category Management (Create & Delete) */}
          {isManagingCategories && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
              <div className="w-full max-w-md ios-card p-5 bg-[#1C1C1E] border border-white/[0.12] shadow-2xl flex flex-col max-h-[90vh]">
                <div className="flex items-center justify-between pb-3 border-b border-white/[0.08]">
                  <div className="flex items-center gap-2">
                    <Icons.Folder className="w-4 h-4 text-[#0A84FF]" />
                    <h3 className="text-[16px] font-bold text-white">Управление категориями</h3>
                  </div>
                  <button
                    onClick={() => setIsManagingCategories(false)}
                    className="p-1 rounded-full text-[#8E8E93] hover:text-white hover:bg-white/10"
                  >
                    <Icons.Close className="w-4 h-4" />
                  </button>
                </div>

                <div className="overflow-y-auto py-3 space-y-4 flex-1">
                  
                  {/* Category Deletion List */}
                  {collections.filter(c => c.id !== 'all').length > 0 && (
                    <div>
                      <label className="block text-[11px] font-semibold uppercase tracking-wider text-[#8E8E93] mb-2">
                        Ваши категории ({collections.length - 1})
                      </label>
                      <div className="space-y-1.5 max-h-52 overflow-y-auto pr-1">
                        {collections.filter(c => c.id !== 'all').map(col => {
                          const CatIcon = getCategoryIconComp(col.iconId);
                          const count = items.filter(it => it.collectionId === col.id).length;

                          return (
                            <div
                              key={col.id}
                              className="flex items-center justify-between p-2 rounded-[12px] bg-white/[0.03] border border-white/[0.05] hover:bg-white/[0.06] transition-colors"
                            >
                              <div className="flex items-center gap-2 min-w-0">
                                <span className="w-7 h-7 rounded-[8px] bg-[#0A84FF]/10 text-[#0A84FF] flex items-center justify-center flex-shrink-0">
                                  <CatIcon className="w-3.5 h-3.5" />
                                </span>
                                <span className="text-[13px] font-medium text-white truncate">{col.name}</span>
                                <span className="text-[10px] text-[#8E8E93] bg-white/[0.06] px-1.5 py-0.5 rounded-full">{count}</span>
                              </div>

                              {/* Delete Category Button triggers in-app iOS modal */}
                              <button
                                onClick={() => requestDeleteCategory(col.id, col.name)}
                                className="p-1.5 rounded-[8px] text-[#8E8E93] hover:text-rose-400 hover:bg-rose-500/10 transition-colors"
                                title="Удалить категорию"
                              >
                                <Icons.Trash className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {/* Create New Category Section */}
                  <div className={collections.filter(c => c.id !== 'all').length > 0 ? "pt-3 border-t border-white/[0.08]" : ""}>
                    <label className="block text-[11px] font-semibold uppercase tracking-wider text-[#8E8E93] mb-2">
                      Добавить новую категорию
                    </label>
                    
                    <form onSubmit={handleCreateCategory} className="space-y-3">
                      <div className="flex gap-2">
                        <input
                          type="text"
                          value={newCategoryName}
                          onChange={(e) => setNewCategoryName(e.target.value)}
                          placeholder="Название категории..."
                          className="flex-1 h-9 px-3 rounded-[10px] bg-black/50 text-[13px] text-white placeholder-[#8E8E93] border border-white/10 focus:outline-none focus:border-[#0A84FF]"
                        />
                        <button
                          type="submit"
                          disabled={!newCategoryName.trim()}
                          className="h-9 px-4 rounded-[10px] bg-[#0A84FF] text-white text-[12px] font-semibold hover:bg-[#0071E3] disabled:opacity-40 transition-all shadow-sm"
                        >
                          Создать
                        </button>
                      </div>

                      <div>
                        <span className="block text-[11px] text-[#8E8E93] mb-1.5">Векторная иконка:</span>
                        <div className="grid grid-cols-7 gap-1.5 max-h-36 overflow-y-auto p-1.5 bg-black/40 rounded-[12px] border border-white/5">
                          {AVAILABLE_ICONS.map(ic => {
                            const IconComponent = (ic && typeof ic.Comp === 'function') ? ic.Comp : (Icons[ic.id] || Icons.Folder);
                            const isSelected = selectedIconId === ic.id;
                            return (
                              <button
                                type="button"
                                key={ic.id}
                                onClick={() => setSelectedIconId(ic.id)}
                                className={`p-2 rounded-[8px] flex items-center justify-center transition-all ${
                                  isSelected
                                    ? 'bg-[#0A84FF] text-white ring-2 ring-[#0A84FF]/40'
                                    : 'text-[#8E8E93] hover:text-white hover:bg-white/10'
                                }`}
                                title={ic.label}
                              >
                                <IconComponent className="w-3.5 h-3.5" />
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </form>
                  </div>
                </div>

                <div className="pt-3 border-t border-white/[0.08]">
                  <button
                    onClick={() => setIsManagingCategories(false)}
                    className="w-full h-9 rounded-[10px] text-[13px] font-medium text-white bg-white/10 hover:bg-white/15 transition-colors"
                  >
                    Готово
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal 2: Custom iOS Confirmation Modal for Category Deletion */}
          {categoryToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
              <div className="w-full max-w-xs ios-card p-5 bg-[#1C1C1E] border border-white/[0.12] shadow-2xl text-center rounded-[24px]">
                <div className="w-12 h-12 rounded-full bg-rose-500/15 text-rose-500 mx-auto flex items-center justify-center mb-3">
                  <Icons.Trash className="w-6 h-6" />
                </div>
                <h4 className="text-[17px] font-bold text-white mb-1.5">Удалить категорию?</h4>
                <p className="text-[13px] text-[#8E8E93] leading-relaxed mb-5">
                  Категория «{categoryToDelete.name}» будет удалена. Все закладки из неё сохранятся в папке «Не сортировано».
                </p>
                <div className="space-y-2">
                  <button
                    onClick={() => executeDeleteCategory(categoryToDelete.id)}
                    className="w-full h-10 rounded-[12px] bg-rose-500 hover:bg-rose-600 text-white font-semibold text-[13px] transition-colors shadow-sm"
                  >
                    Удалить
                  </button>
                  <button
                    onClick={() => setCategoryToDelete(null)}
                    className="w-full h-10 rounded-[12px] bg-white/[0.08] hover:bg-white/[0.12] text-white font-medium text-[13px] transition-colors"
                  >
                    Отмена
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal 3: AI Configuration (Gemma / Gemini / Built-in Free) */}
          {isAiSettingsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
              <div className="w-full max-w-md ios-card p-5 bg-[#1C1C1E] border border-white/[0.12] shadow-2xl flex flex-col max-h-[90vh]">
                <div className="flex items-center justify-between pb-3 border-b border-white/[0.08]">
                  <div className="flex items-center gap-2">
                    <Icons.Sparkles className="w-4 h-4 text-[#0A84FF]" />
                    <h3 className="text-[16px] font-bold text-white">Настройка ИИ по API</h3>
                  </div>
                  <button
                    onClick={() => setIsAiSettingsOpen(false)}
                    className="p-1 rounded-full text-[#8E8E93] hover:text-white hover:bg-white/10"
                  >
                    <Icons.Close className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleSaveAiConfig} className="overflow-y-auto py-3 space-y-4 flex-1">
                  
                  {/* Built-in Status Note */}
                  <div className="p-3 rounded-[12px] bg-[#0A84FF]/10 border border-[#0A84FF]/20 text-[12px] leading-relaxed text-[#0A84FF]">
                    <span className="font-semibold block mb-0.5">⚡ Бесплатный анализ ссылок уже работает:</span>
                    Приложение автоматически извлекает настоящий заголовок, описание и автора с любой страницы через веб-парсер. Добавьте API ключ ниже для глубоких AI-саммари от Gemma 2.
                  </div>

                  {/* Provider Selection */}
                  <div>
                    <label className="block text-[11px] font-semibold uppercase tracking-wider text-[#8E8E93] mb-1.5">
                      Провайдер ИИ
                    </label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setTempAiConfig({ ...tempAiConfig, provider: 'groq', model: 'gemma2-9b-it' })}
                        className={`p-2.5 rounded-[12px] text-left border transition-all ${
                          tempAiConfig.provider === 'groq'
                            ? 'bg-[#0A84FF]/15 border-[#0A84FF] text-white shadow-sm'
                            : 'bg-white/[0.03] border-white/5 text-[#8E8E93] hover:text-white'
                        }`}
                      >
                        <div className="font-semibold text-[13px] text-white">Google Gemma 2</div>
                        <div className="text-[10px] text-emerald-400 mt-0.5">Бесплатно (Groq)</div>
                      </button>

                      <button
                        type="button"
                        onClick={() => setTempAiConfig({ ...tempAiConfig, provider: 'gemini', model: 'gemini-1.5-flash' })}
                        className={`p-2.5 rounded-[12px] text-left border transition-all ${
                          tempAiConfig.provider === 'gemini'
                            ? 'bg-[#0A84FF]/15 border-[#0A84FF] text-white shadow-sm'
                            : 'bg-white/[0.03] border-white/5 text-[#8E8E93] hover:text-white'
                        }`}
                      >
                        <div className="font-semibold text-[13px] text-white">Google Gemini</div>
                        <div className="text-[10px] text-emerald-400 mt-0.5">Бесплатно (AI Studio)</div>
                      </button>
                    </div>
                  </div>

                  {/* API Key Input */}
                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="text-[11px] font-semibold uppercase tracking-wider text-[#8E8E93]">
                        API Ключ
                      </label>
                      {tempAiConfig.provider === 'groq' && (
                        <a
                          href="https://console.groq.com/keys"
                          target="_blank"
                          rel="noreferrer"
                          className="text-[11px] text-[#0A84FF] hover:underline"
                        >
                          Получить бесплатный ключ Groq ↗
                        </a>
                      )}
                      {tempAiConfig.provider === 'gemini' && (
                        <a
                          href="https://aistudio.google.com/app/apikey"
                          target="_blank"
                          rel="noreferrer"
                          className="text-[11px] text-[#0A84FF] hover:underline"
                        >
                          Получить бесплатный ключ Gemini ↗
                        </a>
                      )}
                    </div>
                    
                    <div className="relative">
                      <input
                        type="password"
                        value={tempAiConfig.apiKey}
                        onChange={(e) => setTempAiConfig({ ...tempAiConfig, apiKey: e.target.value })}
                        placeholder={tempAiConfig.provider === 'groq' ? "gsk_..." : "AIzaSy..."}
                        className="w-full h-10 pl-9 pr-3 rounded-[12px] bg-black/50 text-[13px] text-white placeholder-[#8E8E93] border border-white/10 focus:outline-none focus:border-[#0A84FF]"
                      />
                      <span className="absolute left-3 top-1/2 -translate-y-1/2 text-[#8E8E93]">
                        <Icons.Key className="w-3.5 h-3.5" />
                      </span>
                    </div>
                    <p className="text-[10px] text-[#8E8E93] mt-1.5 leading-relaxed">
                      Ключ хранится локально на вашем телефоне в памяти приложения.
                    </p>
                  </div>

                  {/* Model Selection */}
                  <div>
                    <label className="block text-[11px] font-semibold uppercase tracking-wider text-[#8E8E93] mb-1.5">
                      Модель
                    </label>
                    <select
                      value={tempAiConfig.model}
                      onChange={(e) => setTempAiConfig({ ...tempAiConfig, model: e.target.value })}
                      className="w-full h-10 px-3 rounded-[12px] bg-black/50 text-[13px] text-white border border-white/10 focus:outline-none focus:border-[#0A84FF]"
                    >
                      {tempAiConfig.provider === 'groq' ? (
                        <>
                          <option value="gemma2-9b-it">Google Gemma 2 9B (Быстрая, умная и бесплатная)</option>
                          <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Максимальная глубина)</option>
                        </>
                      ) : (
                        <>
                          <option value="gemini-1.5-flash">Gemini 1.5 Flash (Рекомендуется)</option>
                          <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                        </>
                      )}
                    </select>
                  </div>

                  {/* Test Connection Button */}
                  <div className="pt-2">
                    <button
                      type="button"
                      onClick={handleTestApi}
                      disabled={testApiStatus === 'testing'}
                      className="w-full h-9 rounded-[10px] bg-white/5 hover:bg-white/10 text-white text-[12px] font-medium border border-white/10 transition-colors flex items-center justify-center gap-1.5 disabled:opacity-40"
                    >
                      {testApiStatus === 'testing' ? (
                        <>
                          <span className="animate-spin text-sm">✦</span>
                          <span>Тестирую анализ ссылки...</span>
                        </>
                      ) : (
                        <>
                          <Icons.Sparkles className="w-3.5 h-3.5 text-[#0A84FF]" />
                          <span>Проверить работу анализатора</span>
                        </>
                      )}
                    </button>

                    {testApiMsg && (
                      <div className={`mt-2 p-2 rounded-[8px] text-[11px] leading-relaxed border ${
                        testApiStatus === 'success'
                          ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'
                          : testApiStatus === 'error'
                          ? 'bg-rose-500/10 border-rose-500/30 text-rose-400'
                          : 'bg-white/5 border-white/10 text-[#8E8E93]'
                      }`}>
                        {testApiMsg}
                      </div>
                    )}
                  </div>

                  {/* Action Buttons */}
                  <div className="pt-3 border-t border-white/[0.08] flex gap-2">
                    <button
                      type="button"
                      onClick={() => setIsAiSettingsOpen(false)}
                      className="flex-1 h-9 rounded-[10px] text-[12px] font-medium text-[#8E8E93] hover:text-white bg-white/5"
                    >
                      Отмена
                    </button>
                    <button
                      type="submit"
                      className="flex-1 h-9 rounded-[10px] bg-[#0A84FF] text-white text-[12px] font-semibold hover:bg-[#0071E3] transition-all shadow-sm"
                    >
                      Сохранить
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
