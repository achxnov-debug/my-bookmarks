      const getCategoryInfo = (collectionId) => {
        if (!collectionId || collectionId === 'all') {
          return { name: 'Не сортировано', isAssigned: false, Icon: Icons.Folder };
        }
        const found = collections.find(c => c.id === collectionId);
        if (found) {
          return { name: found.name, isAssigned: true, Icon: found.Icon };
        }
        return { name: 'Не сортировано', isAssigned: false, Icon: Icons.Folder };
      };

        e.preventDefault();
        if (!newCategoryName.trim()) return;

        const iconObj = AVAILABLE_ICONS.find(i => i.id === selectedIconId) || AVAILABLE_ICONS[0];
        const newCat = {
          id: `cat_${Date.now()}`,
          name: newCategoryName.trim(),
          Icon: iconObj.Comp
        };

        setCollections([...collections, newCat]);
        setActiveCollection(newCat.id);
        setNewCategoryName('');
        setIsCreatingCategory(false);
      };

      const handleAddUrl = () => {
        if (!urlInput.trim()) return;
        setIsProcessing(true);

        setTimeout(() => {
          let platform = 'Web';
          const u = urlInput.toLowerCase();
          if (u.includes('youtube') || u.includes('youtu.be')) platform = 'YouTube';
          else if (u.includes('instagram')) platform = 'Instagram';
          else if (u.includes('tiktok')) platform = 'TikTok';
          else if (u.includes('threads.net')) platform = 'Threads';
          else if (u.includes('twitter') || u.includes('x.com')) platform = 'X';
          else if (u.includes('t.me')) platform = 'Telegram';

                             : 'article';

            id: String(Date.now()),
            url: urlInput,
            title: urlInput.includes('pasta') ? 'Рецепт классической итальянской пасты'

            isPinned: false,
            savedAt: 'Только что',
            tags: ['AI-Саммари', platform],
            collectionId: activeCollection !== 'all' ? activeCollection : null
          });
          setIsProcessing(false);
        }, 550);

        if (!aiPreview) return;
        setItems([aiPreview, ...items]);

                            <div className="px-2.5 py-1 rounded-[9px] text-[11px] font-medium ios-glass shadow-sm flex items-center gap-1.5 border border-white/10 text-[#8E8E93]">
                              <Icons.Folder className="w-3 h-3 text-[#8E8E93]" />
                              <span className="text-[11px] font-medium text-[#8E8E93]">Не сортировано</span>
                            </div>
                          )}
                        </div>

                        {/* Pinned Ribbon with Vector Star */}
                        {item.isPinned && (
                          <div className="absolute top-3 right-3 w-6 h-6 rounded-full bg-amber-500/90 text-white flex items-center justify-center text-xs shadow-sm backdrop-blur-md">
                            <Icons.Star className="w-3 h-3 fill-current text-white" />
                          </div>
                        )}
                      </div>
                    )}

                    {/* Card Content Body */}
                    <div className="p-4">
                      {/* Clean Author & Source Info */}
                      <div className="flex items-center justify-between mb-1.5 text-[11px] text-[#8E8E93]">
                        <span className="font-medium text-white/80">{item.author}</span>
                        <span className="text-[10px] text-[#8E8E93]/70">{item.platform}</span>
                      </div>

                      {/* Title */}
                      <h3 className="text-[15px] font-semibold tracking-tight leading-snug line-clamp-2 mb-2 text-white group-hover:text-[#0A84FF] transition-colors">
                        {item.title}
                      </h3>

                      {/* Apple Intelligence Summary Pill */}
                      {item.aiSummary && (
                        <div className="mb-3">
                          <button
                            onClick={() => setActiveSummaryId(isSummaryOpen ? null : item.id)}
                            className="inline-flex items-center gap-1.5 text-[11px] font-medium text-[#0A84FF] hover:underline"
                          >
                            <Icons.Sparkles className="w-3.5 h-3.5 text-[#0A84FF]" />
                            <span>{isSummaryOpen ? 'Свернуть выжимку' : 'AI-Саммари'}</span>
                          </button>
                          {isSummaryOpen && (
                            <div className="mt-2 p-2.5 rounded-[12px] bg-[#0A84FF]/[0.08] border border-[#0A84FF]/20 text-[12px] leading-relaxed text-[#E5E5EA] animate-fade-in">
                              {item.aiSummary}
                            </div>
                          )}
                        </div>
                      )}

                      {/* Tags */}
                      <div className="flex flex-wrap gap-1.5 mt-2">
                        {item.tags.map((tag, i) => (
                          <span
                            key={i}
                            className="px-2 py-0.5 rounded-[7px] text-[11px] font-medium bg-white/[0.06] text-[#8E8E93] flex items-center gap-1"
                          >
                            <Icons.Tag className="w-2.5 h-2.5 text-[#8E8E93]/70" />
                            <span>{tag}</span>
                          </span>
                        ))}
                      </div>

                      {/* Footer Actions */}
                      <div className="flex items-center justify-between pt-3 mt-3 border-t border-white/[0.06] text-[11px] text-[#8E8E93]">
                        <span className="flex items-center gap-1.5">
                          <Icons.Clock className="w-3 h-3 text-[#8E8E93]" />
                          <span>{item.savedAt}</span>
                        </span>
                        <div className="flex items-center gap-1 opacity-70 group-hover:opacity-100 transition-opacity">
                          <button
                            onClick={() => togglePin(item.id)}
                            className={`p-1.5 rounded-md hover:bg-white/[0.08] transition-colors ${item.isPinned ? 'text-amber-400' : 'text-[#8E8E93] hover:text-white'}`}
                            title={item.isPinned ? 'Открепить' : 'Закрепить'}
                          >
                            <Icons.Star className="w-3.5 h-3.5 fill-current" />
                          </button>
                          <a
                            href={item.url}
                            target="_blank"
                            rel="noreferrer"
                            className="p-1.5 rounded-md hover:bg-white/[0.08] text-[#8E8E93] hover:text-[#0A84FF] transition-colors"
                            title="Открыть оригинал"
                          >
                            <Icons.External className="w-3.5 h-3.5" />
                          </a>
                          <button
                            onClick={() => deleteItem(item.id)}
                            className="p-1.5 rounded-md hover:bg-white/[0.08] text-[#8E8E93] hover:text-[#FF453A] transition-colors"
                            title="Удалить"
                          >
                            <Icons.Trash className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            {filteredItems.length === 0 && (
              <div className="text-center py-24 ios-card bg-[#1C1C1E]/50 border border-dashed border-white/10 max-w-lg mx-auto">
                <div className="w-12 h-12 rounded-full bg-white/[0.06] mx-auto flex items-center justify-center text-lg text-[#8E8E93] mb-3">
                  <Icons.Search />
                </div>
                <h3 className="text-base font-semibold mb-1 text-white">В этой категории пока пусто</h3>
                <p className="text-xs text-[#8E8E93] max-w-sm mx-auto mb-4">
                  Вставьте ссылку на любой пост в поле выше, чтобы сохранить первую закладку в эту категорию.
                </p>
                <button
                  onClick={() => setActiveCollection('all')}
                  className="px-4 py-1.5 rounded-[9px] bg-white/[0.08] hover:bg-white/[0.12] text-xs font-medium text-white transition-all"
                >
                  Вернуться ко всем закладкам
                </button>
              </div>
            )}
          </main>

          {/* iOS Modal: Create New Category */}
          {isCreatingCategory && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-4">
              <div className="ios-card w-full max-w-lg p-6 bg-[#1C1C1E] border border-white/15 shadow-2xl animate-fade-in max-h-[90vh] flex flex-col">
                <div className="flex items-center justify-between mb-4 flex-shrink-0">
                  <div>
                    <h3 className="text-base font-semibold text-white">Новая категория</h3>
                    <p className="text-xs text-[#8E8E93]">Создайте тематическую папку для умной сортировки</p>
                  </div>
                  <button onClick={() => setIsCreatingCategory(false)} className="text-[#8E8E93] hover:text-white text-sm p-1">
                    <Icons.Close className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleCreateCategory} className="flex-1 flex flex-col overflow-hidden">
                  <div className="mb-4 flex-shrink-0">
                    <label className="text-[12px] font-medium text-[#8E8E93] block mb-1.5">
                      Название категории
                    </label>
                    <input
                      type="text"
                      value={newCategoryName}
                      onChange={(e) => setNewCategoryName(e.target.value)}
                      placeholder="Например: Инвестиции, Фитнес, Стартапы, Книги..."
                      className="w-full h-10 px-3.5 rounded-[11px] bg-white/[0.06] border border-white/10 text-white text-[13px] placeholder-[#8E8E93] focus:outline-none focus:border-[#0A84FF]"
                      autoFocus
                    />
                  </div>

                  <div className="mb-4 flex-1 overflow-y-auto pr-1">
                    <label className="text-[12px] font-medium text-[#8E8E93] block mb-2">
                      Выберите векторную иконку (24 варианта)
                    </label>
                    <div className="grid grid-cols-4 sm:grid-cols-6 gap-2">
                      {AVAILABLE_ICONS.map((icon) => {
                        const IconComp = icon.Comp;
                        const isSelected = selectedIconId === icon.id;
                        return (
                          <button
                            type="button"
                            key={icon.id}
                            onClick={() => setSelectedIconId(icon.id)}
                            className={`flex flex-col items-center justify-center py-2.5 px-1 rounded-[12px] transition-all border ${
                              isSelected
                                ? 'bg-[#0A84FF] text-white border-[#0A84FF] shadow-md shadow-[#0A84FF]/30'
                                : 'bg-white/[0.04] text-[#8E8E93] hover:text-white border-transparent hover:bg-white/[0.08]'
                            }`}
                          >
                            <IconComp className="w-4 h-4 mb-1" />
                            <span className="text-[10px] font-medium truncate w-full text-center">
                              {icon.label}
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-3 border-t border-white/[0.08] flex-shrink-0">
                    <button
                      type="button"
                      onClick={() => setIsCreatingCategory(false)}
                      className="px-4 py-2 rounded-[10px] text-[13px] font-medium text-[#8E8E93] hover:text-white"
                    >
                      Отмена
                    </button>
                    <button
                      type="submit"
                      disabled={!newCategoryName.trim()}
                      className="px-5 py-2 rounded-[10px] bg-[#0A84FF] hover:bg-[#0071E3] disabled:opacity-40 text-white text-[13px] font-medium shadow-sm transition-all"
                    >
                      Создать категорию
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
