    // Client-side call to Google Gemini or Groq Gemma
    const requestAIAnalysis = async (url, config) => {
      const { provider, apiKey, model, customEndpoint } = config;
      if (!apiKey || !apiKey.trim()) {
        throw new Error('API ключ не задан. Перейдите в настройки ИИ.');
      }

      const systemPrompt = "Ты персональный AI-ассистент менеджера закладок. Твоя задача — извлечь максимум пользы из предоставленной ссылки/материала. Отвечай строго валидным JSON без markdown разметки.";
      const userPrompt = `Ссылка или текст пользователя: "${url}".
Сформируй JSON объект со следующими полями:
- "title": понятный, красивый заголовок материала на русском языке (макс. 100 символов).
- "summary": емкая выжимка сути и пользы из 1-2 предложений на русском языке.
- "tags": массив из 3-4 релевантных русскоязычных тегов (например: ["Нейросети", "Гайд", "Технологии"]).
- "platform": определи источник (Instagram, TikTok, YouTube, Threads, X, Telegram или Web).

Формат строго: {"title":"...","summary":"...","tags":["..."],"platform":"..."}`;

      if (provider === 'gemini') {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model || 'gemini-1.5-flash'}:generateContent?key=${apiKey.trim()}`;
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `${systemPrompt}\n\n${userPrompt}` }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error?.message || `Ошибка Google Gemini API (${res.status})`);
        }
        const data = await res.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
        return JSON.parse(text);
      } else {
        // Groq (Gemma / Llama) or Custom OpenAI-compatible endpoint
        const endpoint = provider === 'groq'
          ? 'https://api.groq.com/openai/v1/chat/completions'
          : (customEndpoint || 'https://openrouter.ai/api/v1/chat/completions');

        const chosenModel = provider === 'groq' ? (model || 'gemma2-9b-it') : (model || 'google/gemma-2-9b-it:free');

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey.trim()}`
          },
          body: JSON.stringify({
            model: chosenModel,
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: userPrompt }
            ],
            response_format: { type: "json_object" }
          })
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error?.message || `Ошибка API (${res.status}): ${res.statusText}`);
        }
        const data = await res.json();
        const text = data.choices?.[0]?.message?.content;
        return JSON.parse(text);
      }
    };

      // Helper to resolve icon component by ID
      const getCategoryIconComp = (iconId) => {
        const found = AVAILABLE_ICONS.find(i => i.id === iconId);
        return found ? found.Comp : (Icons[iconId] || Icons.Folder);
      };

      // Helper to find category info for bookmark
      const getCategoryInfo = (collectionId) => {
        if (!collectionId || collectionId === 'all') {
          return { name: 'Не сортировано', isAssigned: false, Icon: Icons.Folder };
        }
        const found = collections.find(c => c.id === collectionId);
        if (found) {
          return { name: found.name, isAssigned: true, Icon: getCategoryIconComp(found.iconId) };
        }
        return { name: 'Не сортировано', isAssigned: false, Icon: Icons.Folder };
      };

      // Add New Category
      const handleCreateCategory = (e) => {
        e.preventDefault();

          id: `cat_${Date.now()}`,
          name: newCategoryName.trim(),
          iconId: selectedIconId

        const updated = [...collections, newCat];
        setCollections(updated);
        setActiveCollection(newCat.id);
        setNewCategoryName('');
      };

      // Delete Category Action
      const handleDeleteCategory = (catId, catName) => {
        if (catId === 'all') return;
        if (!confirm(`Удалить категорию "${catName}"? Закладки из неё будут сохранены как «Не сортировано».`)) {
          return;
        }

        // Reassign bookmarks from this category to null ("Не сортировано")
        const updatedItems = items.map(it => it.collectionId === catId ? { ...it, collectionId: null } : it);
        setItems(updatedItems);

        // Remove category
        const updatedCollections = collections.filter(c => c.id !== catId);
        setCollections(updatedCollections);

        // Reset active filter if was this category
        if (activeCollection === catId) {
          setActiveCollection('all');
        }
      };

      // Test AI API Connection
      const handleTestApi = async () => {
        setTestApiStatus('testing');
        setTestApiMsg('Отправка проверочного запроса к модели...');
        try {
          const testRes = await requestAIAnalysis('https://youtube.com/watch?v=demo_video_ai', tempAiConfig);

      // Handle Adding URL with Real AI or Heuristics

        const u = urlInput.toLowerCase();
        if (u.includes('youtube') || u.includes('youtu.be')) platform = 'YouTube';
        else if (u.includes('instagram')) platform = 'Instagram';
        else if (u.includes('tiktok')) platform = 'TikTok';

        let detectedType = (platform === 'YouTube' || platform === 'TikTok') ? 'video'

        let finalTitle = `Публикация из ${platform}`;
        let finalSummary = 'Материал успешно сохранён в закладки и структурирован.';
        let finalTags = ['AI-Саммари', platform];

        // Try Real API if Key is Configured
        if (aiConfig.apiKey && aiConfig.apiKey.trim()) {
          try {
            const aiData = await requestAIAnalysis(urlInput, aiConfig);

            if (aiData.summary) finalSummary = aiData.summary;

                        value={tempAiConfig.model}
                        onChange={(e) => setTempAiConfig({ ...tempAiConfig, model: e.target.value })}
                        className="w-full h-10 px-3 rounded-[12px] bg-black/50 text-[13px] text-white border border-white/10 focus:outline-none focus:border-[#0A84FF]"
                      >
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash (Рекомендуется)</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                      </select>
                    ) : (
                      <div className="space-y-2">
                        <input
                          type="text"
                          value={tempAiConfig.model}
                          onChange={(e) => setTempAiConfig({ ...tempAiConfig, model: e.target.value })}
                          placeholder="Например: google/gemma-2-9b-it:free"
                          className="w-full h-9 px-3 rounded-[10px] bg-black/50 text-[13px] text-white placeholder-[#8E8E93] border border-white/10 focus:outline-none focus:border-[#0A84FF]"
                        />
                        <input
                          type="url"
                          value={tempAiConfig.customEndpoint}
                          onChange={(e) => setTempAiConfig({ ...tempAiConfig, customEndpoint: e.target.value })}
                          placeholder="Базовый URL: https://openrouter.ai/api/v1/chat/completions"
                          className="w-full h-9 px-3 rounded-[10px] bg-black/50 text-[12px] text-white placeholder-[#8E8E93] border border-white/10 focus:outline-none focus:border-[#0A84FF]"
                        />
                      </div>
                    )}
                  </div>

                  {/* Test Connection Button & Status */}
                  <div className="pt-2">
                    <button
                      type="button"
                      onClick={handleTestApi}
                      disabled={!tempAiConfig.apiKey || testApiStatus === 'testing'}
                      className="w-full h-9 rounded-[10px] bg-white/5 hover:bg-white/10 text-white text-[12px] font-medium border border-white/10 transition-colors flex items-center justify-center gap-1.5 disabled:opacity-40"
                    >
                      {testApiStatus === 'testing' ? (
                        <>
                          <span className="animate-spin text-sm">✦</span>
                          <span>Проверка ключа...</span>
                        </>
                      ) : (
                        <>
                          <Icons.Sparkles className="w-3.5 h-3.5 text-[#0A84FF]" />
                          <span>Проверить подключение к ИИ</span>
                        </>
                      )}
                    </button>

                    {testApiMsg && (
                      <div className={`mt-2 p-2 rounded-[8px] text-[11px] leading-relaxed border ${
                        testApiStatus === 'success'
                          ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'
                          : testApiStatus === 'error'
                          ? 'bg-rose-500/10 border-rose-500/30 text-rose-400'
                          : 'bg-white/5 border-white/10 text-[#8E8E93]'
                      }`}>
                        {testApiMsg}
                      </div>
                    )}
                  </div>

                  {/* Action Buttons */}
                  <div className="pt-3 border-t border-white/[0.08] flex gap-2">
                    <button
                      type="button"
                      onClick={() => setIsAiSettingsOpen(false)}
                      className="flex-1 h-9 rounded-[10px] text-[12px] font-medium text-[#8E8E93] hover:text-white bg-white/5"
                    >
                      Отмена
                    </button>
                    <button
                      type="submit"
                      className="flex-1 h-9 rounded-[10px] bg-[#0A84FF] text-white text-[12px] font-semibold hover:bg-[#0071E3] transition-all shadow-sm"
                    >
                      Сохранить
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
