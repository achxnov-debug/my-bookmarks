      let image = '';

      const u = url.toLowerCase();
      if (u.includes('youtube') || u.includes('youtu.be')) platform = 'YouTube';
      else if (u.includes('instagram')) platform = 'Instagram';
      else if (u.includes('tiktok')) platform = 'TikTok';
      else if (u.includes('threads.net')) platform = 'Threads';
      else if (u.includes('twitter') || u.includes('x.com')) platform = 'X';
      else if (u.includes('t.me')) platform = 'Telegram';

      // 1. Fetch live OpenGraph metadata from the real URL via free Microlink API
      try {
        const metaRes = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}&screenshot=false`, {
          signal: AbortSignal.timeout(6000)
        });
        if (metaRes.ok) {
          const metaData = await metaRes.json();
          if (metaData.status === 'success' && metaData.data) {
            const d = metaData.data;
            if (d.title) title = d.title;
            if (d.description) description = d.description;
            if (d.publisher) platform = d.publisher;
            if (d.author) author = d.author;
            if (d.image?.url) image = d.image.url;

        console.log('Direct metadata note:', e.message);

          const userPrompt = `Ссылка: "${url}". Информация со страницы: Заголовок: "${title}", Описание: "${description}", Платформа: "${platform}".${catPrompt} Сформируй JSON объект: {"title": "краткий емкий заголовок на русском", "summary": "емкая выжимка сути и пользы из 1-2 предложений на русском", "tags": ["тег1", "тег2", "тег3"], "platform": "${platform}", "suggestedCategoryId": "id_категории_или_null"}`;

            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: `${systemPrompt}\n\n${userPrompt}` }] }],
                generationConfig: { responseMimeType: "application/json" }
              })
            });
            if (res.ok) {
              const data = await res.json();
              const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
              const parsed = JSON.parse(text);
              const matchedCatId = (parsed.suggestedCategoryId && parsed.suggestedCategoryId !== 'null')
                ? parsed.suggestedCategoryId
                : matchCategoryLocally(`${parsed.title} ${parsed.summary} ${title} ${description}`, parsed.tags, userCats);

                title: parsed.title || title || `Публикация из ${platform}`,
                summary: parsed.summary || description || 'Материал успешно сохранён в архив.',

            // Groq Gemma / Custom
            const endpoint = aiConf.provider === 'groq'
              ? 'https://api.groq.com/openai/v1/chat/completions'
              : (aiConf.customEndpoint || 'https://openrouter.ai/api/v1/chat/completions');

            const chosenModel = aiConf.provider === 'groq' ? (aiConf.model || 'gemma2-9b-it') : aiConf.model;

            const res = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${aiConf.apiKey.trim()}`
              },
              body: JSON.stringify({
                model: chosenModel,
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: userPrompt }
                ],
                response_format: { type: "json_object" }
              })
            });
            if (res.ok) {
              const data = await res.json();
              const parsed = JSON.parse(data.choices?.[0]?.message?.content);
              const matchedCatId = (parsed.suggestedCategoryId && parsed.suggestedCategoryId !== 'null')
                ? parsed.suggestedCategoryId
                : matchCategoryLocally(`${parsed.title} ${parsed.summary} ${title} ${description}`, parsed.tags, userCats);

              return {
                title: parsed.title || title || `Публикация из ${platform}`,
                summary: parsed.summary || description || 'Материал успешно сохранён в архив.',
                tags: parsed.tags && parsed.tags.length ? parsed.tags : [platform, 'Закладки'],
                platform: parsed.platform || platform,
                image: image,
                suggestedCategoryId: matchedCatId
              };
            }
          }
        } catch (err) {
          console.warn('LLM error:', err);
        }
      }

      // 3. Free Built-in Smart Semantic Category Matcher (Zero-key fallback)
      const matchedCatId = matchCategoryLocally(
        `${title} ${description} ${url} ${platform}`,
        [platform],
        userCats
      );

      if (description) {
        const cleanDesc = description.trim();
        const summary = cleanDesc.length > 200 ? cleanDesc.slice(0, 197) + '...' : cleanDesc;
        return {
          title: title || `Публикация из ${platform}`,
          summary: summary,
          tags: [platform, 'Интересное', 'Сохранённое'],
          platform: platform,
          image: image,
          suggestedCategoryId: matchedCatId
        };
      }

      return {
        title: title || `Публикация из ${platform}`,
        summary: `Материал сохранён из ${platform}. Нажмите «Открыть», чтобы перейти к полному контенту.`,
        tags: [platform, 'Закладки'],
        platform: platform,
        image: image,
        suggestedCategoryId: matchedCatId
      };
    };

    function App() {
      // Bookmarks State with LocalStorage
      const [items, setItems] = useState(() => loadStorage('sv_items_v3', INITIAL_ITEMS));
      useEffect(() => { saveStorage('sv_items_v3', items); }, [items]);

      // Categories State with Clean Default (Only "Все")
      const [collections, setCollections] = useState(() => loadStorage('sv_collections_clean_v3', DEFAULT_COLLECTIONS_DATA));
      useEffect(() => { saveStorage('sv_collections_clean_v3', collections); }, [collections]);

      // AI Settings State with LocalStorage
      const [aiConfig, setAiConfig] = useState(() => loadStorage('sv_ai_config_v3', {
        provider: 'groq',
        apiKey: '',
        model: 'gemma2-9b-it',
        customEndpoint: ''
      }));
      useEffect(() => { saveStorage('sv_ai_config_v3', aiConfig); }, [aiConfig]);

      const [searchQuery, setSearchQuery] = useState('');
      const [activeCollection, setActiveCollection] = useState('all');
      const [urlInput, setUrlInput] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      const [aiStatusMsg, setAiStatusMsg] = useState('');
      const [aiPreview, setAiPreview] = useState(null);
      const [activeSummaryId, setActiveSummaryId] = useState(null);

      // Dedicated Share Mode Window State
      const [isShareMode, setIsShareMode] = useState(false);
      const [shareItem, setShareItem] = useState(null);
      const [isShareLoading, setIsShareLoading] = useState(false);
      const [shareSavedToast, setShareSavedToast] = useState(false);

      // Category Management Modals
      const [isManagingCategories, setIsManagingCategories] = useState(false);
      const [newCategoryName, setNewCategoryName] = useState('');
      const [selectedIconId, setSelectedIconId] = useState('Rocket');

      // Custom In-App Deletion Confirmation Modal
      const [categoryToDelete, setCategoryToDelete] = useState(null); // { id, name }

      // AI Settings Modal
      const [isAiSettingsOpen, setIsAiSettingsOpen] = useState(false);
      const [tempAiConfig, setTempAiConfig] = useState(aiConfig);
      const [testApiStatus, setTestApiStatus] = useState(null);
      const [testApiMsg, setTestApiMsg] = useState('');

      const openAiSettings = () => {
        setTempAiConfig(aiConfig);
        setTestApiStatus(null);
        setTestApiMsg('');
        setIsAiSettingsOpen(true);
      };

      const getCategoryIconComp = (iconId) => {
        const found = AVAILABLE_ICONS.find(i => i.id === iconId);
        if (found && typeof found.Comp === 'function') return found.Comp;
        if (Icons[iconId] && typeof Icons[iconId] === 'function') return Icons[iconId];
        return Icons.Folder;
      };

      const getCategoryInfo = (collectionId) => {
        if (!collectionId || collectionId === 'all') {
          return { name: 'Не сортировано', isAssigned: false, Icon: Icons.Folder };
        }
        const found = collections.find(c => c.id === collectionId);
        if (found) {
          return { name: found.name, isAssigned: true, Icon: getCategoryIconComp(found.iconId) };
        }
        return { name: 'Не сортировано', isAssigned: false, Icon: Icons.Folder };
      };

      // Add New Category
      const handleCreateCategory = (e) => {
        e.preventDefault();
        if (!newCategoryName.trim()) return;

        const newCat = {
          id: `cat_${Date.now()}`,
          name: newCategoryName.trim(),
          iconId: selectedIconId
        };

        const updated = [...collections, newCat];
        setCollections(updated);
        setActiveCollection(newCat.id);
        setNewCategoryName('');
      };

      // Trigger In-App Delete Modal
      const requestDeleteCategory = (catId, catName) => {
        if (catId === 'all') return;
        setCategoryToDelete({ id: catId, name: catName });
      };

      // Execute Delete Category Action
      const executeDeleteCategory = (catId) => {
        const updatedItems = items.map(it => it.collectionId === catId ? { ...it, collectionId: null } : it);
        setItems(updatedItems);

        const updatedCollections = collections.filter(c => c.id !== catId);
        setCollections(updatedCollections);

        if (activeCollection === catId) {
          setActiveCollection('all');
        }
        setCategoryToDelete(null);
      };

      // Test AI API Connection
      const handleTestApi = async () => {
        setTestApiStatus('testing');
        setTestApiMsg('Проверка соединения с моделью...');
        try {
          const testRes = await analyzeUrlWithFreeAPI('https://youtube.com/watch?v=pasta_carbonara', tempAiConfig);
          if (testRes && testRes.title) {
            setTestApiStatus('success');
            setTestApiMsg(`✓ Связь с ${tempAiConfig.provider.toUpperCase()} (${tempAiConfig.model}) успешно проверена!`);
          } else {
            throw new Error('Пустой ответ');
          }
        } catch (err) {
          setTestApiStatus('error');
          setTestApiMsg(`✕ ${err.message || 'Ошибка подключения'}`);
        }
      };

      const handleSaveAiConfig = (e) => {
        e.preventDefault();
        setAiConfig(tempAiConfig);
        setIsAiSettingsOpen(false);
      };

      // Handle Adding URL with Live Free AI Analyzer + Smart Categorization
      const handleAddUrl = async (forcedUrl) => {
        let targetUrl = (forcedUrl || urlInput || document.getElementById('url-input')?.value || '').trim();
        if (!targetUrl) return;

        // Auto-prepend https:// if protocol is missing
        if (!/^https?:\/\//i.test(targetUrl)) {
          targetUrl = 'https://' + targetUrl;
        }

        setUrlInput(targetUrl);
        setIsProcessing(true);
        setAiStatusMsg(aiConfig.apiKey ? `Анализирую контент через ${aiConfig.model}...` : 'Извлекаю данные и AI-выжимку...');

        try {
          const analyzed = await analyzeUrlWithFreeAPI(targetUrl, aiConfig, collections);

          let detectedType = (analyzed.platform === 'YouTube' || analyzed.platform === 'TikTok') ? 'video'
                           : (analyzed.platform === 'Threads' || analyzed.platform === 'X') ? 'thread'
                           : 'article';

          // Automatically match category or fallback to active category or null
          const assignedCatId = analyzed.suggestedCategoryId || (activeCollection !== 'all' ? activeCollection : null);
          const foundCat = collections.find(c => c.id === assignedCatId);

          setAiPreview({
            id: String(Date.now()),
            url: targetUrl,
            title: analyzed.title,
            description: analyzed.summary,
            author: `@${analyzed.platform.toLowerCase()}_source`,
            platform: analyzed.platform,
            thumbnailUrl: null,
            aiSummary: analyzed.summary,
            contentType: detectedType,
            isPinned: false,
            savedAt: 'Только что',
            tags: analyzed.tags,
            collectionId: assignedCatId,
            suggestedCategoryName: (foundCat && foundCat.id !== 'all') ? foundCat.name : null
          });
        } catch (err) {
          console.error(err);
        } finally {
          setIsProcessing(false);
        }
      };

      const confirmSave = () => {
        if (!aiPreview) return;
        setItems([aiPreview, ...items]);
        setAiPreview(null);
        setUrlInput('');
        const inputEl = document.getElementById('url-input');
        if (inputEl) inputEl.value = '';
      };

      // Open and process incoming link in the dedicated Quick-Save Share Window
      const handleOpenShareMode = async (targetUrl) => {
        setIsShareMode(true);
        setIsShareLoading(true);
        setShareSavedToast(false);

        let detectedPlatform = 'Web';
        const u = targetUrl.toLowerCase();
        if (u.includes('youtube') || u.includes('youtu.be')) detectedPlatform = 'YouTube';
        else if (u.includes('instagram')) detectedPlatform = 'Instagram';
        else if (u.includes('tiktok')) detectedPlatform = 'TikTok';
        else if (u.includes('threads.net')) detectedPlatform = 'Threads';
        else if (u.includes('twitter') || u.includes('x.com')) detectedPlatform = 'X';
        else if (u.includes('t.me')) detectedPlatform = 'Telegram';

        setShareItem({
          id: String(Date.now()),
          url: targetUrl,
          title: `Публикация из ${detectedPlatform}`,
          description: 'Анализирую...',
          author: `@${detectedPlatform.toLowerCase()}`,
          platform: detectedPlatform,
          thumbnailUrl: null,
          aiSummary: 'ИИ извлекает главное...',
          isPinned: false,
          savedAt: 'Только что',
          tags: [detectedPlatform],
          collectionId: null,
          suggestedCategoryName: null
        });

        try {
          const analyzed = await analyzeUrlWithFreeAPI(targetUrl, aiConfig, collections);
          const assignedCatId = analyzed.suggestedCategoryId || (activeCollection !== 'all' ? activeCollection : null);
          const foundCat = collections.find(c => c.id === assignedCatId);

          setShareItem({
            id: String(Date.now()),
            url: targetUrl,
            title: analyzed.title,
            description: analyzed.summary,
            author: `@${analyzed.platform.toLowerCase()}`,
            platform: analyzed.platform,
            thumbnailUrl: null,
            aiSummary: analyzed.summary,
            isPinned: false,
            savedAt: 'Только что',
            tags: analyzed.tags,
            collectionId: assignedCatId,
            suggestedCategoryName: (foundCat && foundCat.id !== 'all') ? foundCat.name : null
          });
        } catch (e) {
          console.error("Share mode analysis error:", e);
        } finally {
          setIsShareLoading(false);
        }
      };

      const handleShareConfirmSave = () => {
        if (!shareItem) return;
        setItems(prev => [shareItem, ...prev]);
        setShareSavedToast(true);

        setTimeout(() => {
          if (window.AndroidBridge && typeof window.AndroidBridge.closeApp === 'function') {
            window.AndroidBridge.closeApp();
          } else {
            setIsShareMode(false);
            setShareSavedToast(false);
            setShareItem(null);
          }
        }, 700);
      };

      const closeShareWindow = () => {
        if (window.AndroidBridge && typeof window.AndroidBridge.closeApp === 'function') {
          window.AndroidBridge.closeApp();
        } else {
          setIsShareMode(false);
          setShareItem(null);
          setShareSavedToast(false);
        }
      };

      // Native Android Share Intent Listener
      useEffect(() => {
        window.onReceiveSharedUrl = (rawText, fromShareMode = false) => {
          if (!rawText) return;
          const match = rawText.match(/https?:\/\/[^\s]+/i);
          const targetUrl = match ? match[0] : rawText.trim();

          if (fromShareMode || window._pendingIsShareMode) {
            window._pendingIsShareMode = false;
            handleOpenShareMode(targetUrl);
          } else {
            setUrlInput(targetUrl);
            const inputEl = document.getElementById('url-input');
            if (inputEl) inputEl.value = targetUrl;
            handleAddUrl(targetUrl);
          }
        };

        if (window._pendingSharedUrl) {
          const pend = window._pendingSharedUrl;
          const isShare = window._pendingIsShareMode || false;
          window._pendingSharedUrl = null;
          window._pendingIsShareMode = false;
          window.onReceiveSharedUrl(pend, isShare);
        }
      }, [collections, aiConfig, activeCollection]);

      // Tag Click Handler
      const handleTagClick = (tag) => {
        const cleanTag = tag.replace(/^#/, '').trim();
        const currentClean = searchQuery.toLowerCase().replace(/^#/, '').trim();
        if (currentClean === cleanTag.toLowerCase()) {
          setSearchQuery('');
        } else {
          setSearchQuery(cleanTag);
        }
      };

      const togglePin = (id) => {
        setItems(items.map(it => it.id === id ? { ...it, isPinned: !it.isPinned } : it));
      };

      const deleteItem = (id) => {
        setItems(items.filter(it => it.id !== id));
      };

      const filteredItems = useMemo(() => {
        return items.filter(it => {
          if (activeCollection !== 'all' && it.collectionId !== activeCollection) return false;
          if (searchQuery.trim()) {
            const rawQ = searchQuery.toLowerCase().trim();
            const cleanQ = rawQ.replace(/^#/, '');
            const fullText = `${it.title} ${it.description} ${it.aiSummary} ${(it.tags || []).join(' ')} ${it.author}`.toLowerCase();
            return fullText.includes(cleanQ) || fullText.includes(rawQ);
          }
          return true;
        }).sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));
      }, [items, activeCollection, searchQuery]);

      return (
        <div className="min-h-screen bg-black text-white flex flex-col pb-16 w-full max-w-full overflow-x-hidden">
          
          {/* iOS Top Navigation Bar - Solid OLED Pure Black */}
          <header className="sticky top-0 z-30 bg-black border-b border-white/[0.08] w-full">
            <div className="w-full max-w-5xl mx-auto px-4 pt-3 pb-2 flex flex-col gap-2">
              
              {/* Row 1: Spotlight Search Bar + Compact AI Settings Button */}
              <div className="flex items-center gap-2">
                <div className="relative flex-1">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder={filteredItems.length ? `Поиск среди ${filteredItems.length} закладок...` : "Поиск по смыслу или тегам..."}
                    className="w-full h-10 pl-9 pr-8 rounded-[12px] bg-[#1C1C1E] text-[13px] text-white placeholder-[#8E8E93] focus:outline-none focus:ring-1 focus:ring-[#0A84FF]/50 border border-white/[0.08] transition-all"
                  />
                  <span className="absolute left-3 top-1/2 -translate-y-1/2 text-[#8E8E93]">
                    <Icons.Search className="w-4 h-4" />
                  </span>
                  {searchQuery && (
                    <button
                      onClick={() => setSearchQuery('')}
                      className="absolute right-2.5 top-1/2 -translate-y-1/2 text-[#8E8E93] hover:text-white p-1"
                    >
                      <Icons.Close className="w-3.5 h-3.5" />
                    </button>
                  )}
                </div>

                {/* Compact AI Settings Icon Button */}
                <button
                  onClick={openAiSettings}
                  className={`w-10 h-10 rounded-[12px] flex items-center justify-center border transition-all active:scale-95 flex-shrink-0 ${
                    aiConfig.apiKey
                      ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'
                      : 'bg-[#1C1C1E] border-white/[0.08] text-[#8E8E93] hover:text-[#0A84FF]'
                  }`}
                  title="Настройки ИИ по API (Gemma / Gemini)"
                >
                  <Icons.Sparkles className="w-4 h-4" />
                </button>
              </div>

              {/* Row 2: Horizontal Scrollable Categories Bar */}
              <div className="w-full pt-0.5 flex items-center gap-2 overflow-x-auto no-scrollbar">
                {collections.map(col => {
                  const CategoryIcon = getCategoryIconComp(col.iconId);
                  const isActive = activeCollection === col.id;

                  return (
                    <div key={col.id} className="relative flex items-center flex-shrink-0">
                      <button

                      >

                        <button

                          title="Удалить категорию"

                          <Icons.Close className="w-3 h-3" />
                        </button>
                      )}

                {/* Manage / Add Categories Button */}
                <button
                  onClick={() => setIsManagingCategories(true)}
                  className="px-2.5 py-1.5 rounded-[10px] text-[12px] font-medium text-[#0A84FF] bg-[#0A84FF]/10 hover:bg-[#0A84FF]/20 transition-all flex items-center gap-1 border border-[#0A84FF]/30 flex-shrink-0 whitespace-nowrap"
                  title="Создать и управлять категориями"

                  <Icons.Plus className="w-3 h-3" />
                  <span>Категория</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main View Area */}
          <main className="w-full max-w-5xl mx-auto px-4 pt-4 flex-1">
            
            {/* iOS Link Addition Bar */}
            <div className="mb-4 w-full">
              <div className="w-full bg-[#1C1C1E] border border-white/[0.08] rounded-[16px] p-2 flex items-center gap-2 shadow-sm">
                <div className="w-7 h-7 rounded-[8px] bg-[#0A84FF]/15 text-[#0A84FF] flex items-center justify-center flex-shrink-0">
                  <Icons.Bookmark className="w-3.5 h-3.5 fill-current" />
                </div>
                <input
                  id="url-input"
                  type="url"
                  value={urlInput}
                  onChange={(e) => setUrlInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleAddUrl()}
                  placeholder="Вставьте ссылку на любой пост..."
                  className="flex-1 min-w-0 bg-transparent text-[13px] text-white placeholder-[#8E8E93] outline-none px-1"
                  disabled={isProcessing}
                />
                <button
                  onClick={() => handleAddUrl()}
                  disabled={isProcessing || (!urlInput.trim() && !document.getElementById('url-input')?.value)}
                  className="h-7 px-3 rounded-[9px] bg-[#0A84FF] hover:bg-[#0071E3] disabled:opacity-40 text-white text-[12px] font-semibold transition-all flex items-center gap-1 flex-shrink-0 active:scale-95 shadow-sm"
                >
                  {isProcessing ? (
                    <span className="flex items-center gap-1">
                      <span className="animate-spin text-[10px]">✦</span> ИИ...
                    </span>
                  ) : (
                    <span>Сохранить</span>
                  )}
                </button>
              </div>

              {/* Real-time Processing Indicator */}
              {isProcessing && (
                <div className="text-[11px] text-[#0A84FF] mt-1.5 px-2 flex items-center gap-1.5 animate-pulse">
                  <Icons.Sparkles className="w-3 h-3" />
                  <span>{aiStatusMsg}</span>
                </div>
              )}

              {/* Apple Intelligence Preview Sheet (Sleek Image-Free) */}
              {aiPreview && (
                <div className="w-full mt-3 p-3.5 rounded-[18px] border border-[#0A84FF]/40 bg-[#0A84FF]/[0.08] animate-fade-in shadow-lg">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-[11px] font-semibold text-[#0A84FF] flex items-center gap-1.5">
                      <Icons.Sparkles className="w-3.5 h-3.5 text-[#0A84FF]" />
                      <span>Анализ ссылки завершён</span>
                    </span>
                    <button onClick={() => setAiPreview(null)} className="text-[#8E8E93] hover:text-white p-1">
                      <Icons.Close className="w-3.5 h-3.5" />
                    </button>
                  </div>

                  <div className="space-y-2">
                    <h4 className="font-semibold text-[14px] leading-snug line-clamp-2 text-white">{aiPreview.title}</h4>
                    <div className="flex items-center gap-1.5 flex-wrap">
                      <span className="text-[10px] text-[#0A84FF] font-semibold bg-[#0A84FF]/20 px-2 py-0.5 rounded-full">
                        {aiPreview.platform}
                      </span>
                      {aiPreview.tags.map(t => (
                        <span key={t} className="text-[10px] text-[#8E8E93] bg-white/[0.06] px-1.5 py-0.5 rounded-full">

                      ))}
                    </div>
                    {aiPreview.aiSummary && (
                      <p className="text-[11px] text-[#D1D1D6] p-2.5 rounded-[10px] bg-black/50 border border-white/[0.04] leading-relaxed">

                      </p>
                    )}
                  </div>

                  {/* Category Selector with AI Auto-Detect (Custom In-App Pills) */}
                  <div className="mt-2.5 pt-2 border-t border-white/[0.08] space-y-1.5">
                    <div className="flex items-center justify-between text-[11px]">
                      <span className="text-[#8E8E93] flex items-center gap-1.5 font-medium">
                        <Icons.Folder className="w-3.5 h-3.5 text-[#0A84FF]" />
                        <span>Папка для сохранения:</span>
                      </span>
                      {aiPreview.suggestedCategoryName && (
                        <span className="text-[10px] text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded-full border border-emerald-500/20 font-medium">
                          ✦ ИИ выбрал: {aiPreview.suggestedCategoryName}
                        </span>
                      )}
                    </div>

                    <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
                      <button
                        type="button"
                        onClick={() => setAiPreview({ ...aiPreview, collectionId: null, suggestedCategoryName: null })}
                        className={`px-2.5 py-1 rounded-[8px] text-[11px] font-medium transition-all whitespace-nowrap flex items-center gap-1 ${
                          !aiPreview.collectionId
                            ? 'bg-[#0A84FF] text-white shadow-sm'
                            : 'bg-[#2C2C2E] text-[#8E8E93] hover:text-white border border-white/5'
                        }`}
                      >
                        <Icons.Folder className="w-3 h-3" />
                        <span>Не сортировано</span>
                      </button>
                      {collections.filter(c => c && c.id !== 'all').map(col => {
                        const CatIcon = getCategoryIconComp(col.iconId);
                        const isSelected = aiPreview.collectionId === col.id;
                        return (
                          <button
                            type="button"
                            key={col.id}
                            onClick={() => setAiPreview({ ...aiPreview, collectionId: col.id, suggestedCategoryName: col.name })}

                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal 4: Dedicated Quick-Save Share Window ("Спец. окно для функции поделиться") */}
          {isShareMode && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fade-in">
              <div className="w-full max-w-md bg-[#1C1C1E] border border-white/[0.12] rounded-[24px] p-5 shadow-2xl flex flex-col max-h-[90vh]">
                
                {/* Header */}
                <div className="flex items-center justify-between pb-3 border-b border-white/[0.08]">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-[10px] bg-gradient-to-br from-[#0A84FF] to-[#0051D5] flex items-center justify-center text-white shadow-md shadow-[#0A84FF]/25 flex-shrink-0">
                      <Icons.Bookmark className="w-4 h-4 fill-current" />
                    </div>
                    <div>
                      <h3 className="text-[15px] font-bold text-white leading-tight">Сохранить в закладки</h3>
                      <span className="text-[10px] text-[#8E8E93]">Быстрое добавление через «Поделиться»</span>
                    </div>
                  </div>
                  <button
                    onClick={closeShareWindow}
                    className="p-1.5 rounded-full text-[#8E8E93] hover:text-white bg-white/5 active:scale-95 transition-colors"
                    title="Закрыть"
                  >
                    <Icons.Close className="w-4 h-4" />
                  </button>
                </div>

                {/* Body */}
                <div className="py-4 space-y-3.5 overflow-y-auto">
                  
                  {/* Link Preview Bar */}
                  <div className="p-2.5 rounded-[12px] bg-black/40 border border-white/5 flex items-center justify-between gap-2">
                    <div className="flex items-center gap-2 min-w-0">
                      <span className="px-2 py-0.5 rounded-[6px] text-[10px] font-semibold bg-[#0A84FF]/20 text-[#0A84FF] flex-shrink-0">
                        {shareItem ? shareItem.platform : 'Web'}
                      </span>
                      <span className="text-[11px] text-[#8E8E93] truncate font-mono">
                        {shareItem ? shareItem.url : ''}
                      </span>
                    </div>
                  </div>

                  {/* Loading State or Analyzed Result */}
                  {isShareLoading ? (
                    <div className="py-8 flex flex-col items-center justify-center text-center">
                      <div className="w-9 h-9 rounded-full border-2 border-[#0A84FF] border-t-transparent animate-spin mb-3"></div>
                      <p className="text-[13px] font-semibold text-white">ИИ анализирует публикацию...</p>
                      <p className="text-[11px] text-[#8E8E93] mt-1">Определяем заголовок, краткую суть и категорию</p>
                    </div>
                  ) : shareItem ? (
                    <div className="space-y-3 animate-fade-in">
                      {/* Title */}
                      <div>
                        <label className="block text-[10px] font-semibold uppercase tracking-wider text-[#8E8E93] mb-1">
                          Заголовок
                        </label>
                        <h4 className="text-[14px] font-semibold text-white leading-snug">
                          {shareItem.title}
                        </h4>
                      </div>

                      {/* AI Summary */}
                      {shareItem.aiSummary && (
                        <div className="p-3 rounded-[12px] bg-[#0A84FF]/[0.08] border border-[#0A84FF]/20 text-[12px] leading-relaxed text-[#D1D1D6]">
                          <div className="flex items-center gap-1.5 text-[10px] font-semibold text-[#0A84FF] uppercase tracking-wider mb-1">
                            <Icons.Sparkles className="w-3 h-3 text-[#0A84FF]" />
                            <span>Выжимка ИИ</span>
                          </div>
                          <div>{shareItem.aiSummary}</div>
                        </div>
                      )}

                      {/* Category Selector with AI Auto-Match (Custom In-App Pills) */}
                      <div className="p-3 rounded-[12px] bg-black/40 border border-white/5 space-y-2">
                        <div className="flex items-center justify-between text-[11px]">
                          <span className="text-[#8E8E93] flex items-center gap-1.5 font-medium">
                            <Icons.Folder className="w-3.5 h-3.5 text-[#0A84FF]" />
                            <span>Папка для сохранения:</span>
                          </span>
                          {shareItem.suggestedCategoryName && (
                            <span className="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20 font-medium">
                              ✦ ИИ выбрал: {shareItem.suggestedCategoryName}
                            </span>
                          )}
                        </div>

                        <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
                          <button
                            type="button"
                            onClick={() => setShareItem({ ...shareItem, collectionId: null, suggestedCategoryName: null })}
                            className={`px-2.5 py-1.5 rounded-[8px] text-[11px] font-medium transition-all whitespace-nowrap flex items-center gap-1 ${
                              !shareItem.collectionId
                                ? 'bg-[#0A84FF] text-white shadow-sm'
                                : 'bg-[#2C2C2E] text-[#8E8E93] hover:text-white border border-white/5'
                            }`}
                          >
                            <Icons.Folder className="w-3 h-3" />
                            <span>Не сортировано</span>
                          </button>
                          {collections.filter(c => c && c.id !== 'all').map(col => {
                            const CatIcon = getCategoryIconComp(col.iconId);
                            const isSelected = shareItem.collectionId === col.id;
                            return (
                              <button
                                type="button"
                                key={col.id}
                                onClick={() => setShareItem({ ...shareItem, collectionId: col.id, suggestedCategoryName: col.name })}
                                className={`px-2.5 py-1.5 rounded-[8px] text-[11px] font-medium transition-all whitespace-nowrap flex items-center gap-1 ${
                                  isSelected
                                    ? 'bg-[#0A84FF] text-white shadow-sm'
                                    : 'bg-[#2C2C2E] text-[#8E8E93] hover:text-white border border-white/5'
                                }`}
                              >
                                <CatIcon className="w-3 h-3" />
                                <span>{col.name}</span>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  ) : null}

                  {/* Saved Toast */}
                  {shareSavedToast && (
                    <div className="p-3 rounded-[12px] bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 flex items-center justify-center gap-2 text-[13px] font-semibold animate-fade-in">
                      <span>✓</span>
                      <span>Закладка успешно сохранена!</span>
                    </div>
                  )}
                </div>

                {/* Footer Buttons */}
                <div className="pt-3 border-t border-white/[0.08] flex gap-2">
                  <button
                    onClick={closeShareWindow}
                    disabled={isShareLoading || shareSavedToast}
                    className="flex-1 h-11 rounded-[12px] bg-white/[0.08] hover:bg-white/[0.12] disabled:opacity-40 text-white font-medium text-[13px] transition-colors"
                  >
                    Отмена
                  </button>
                  <button
                    onClick={handleShareConfirmSave}
                    disabled={isShareLoading || shareSavedToast || !shareItem}
                    className="flex-1 h-11 rounded-[12px] bg-[#0A84FF] hover:bg-[#0071E3] disabled:opacity-40 text-white font-semibold text-[13px] transition-all shadow-md active:scale-95 flex items-center justify-center gap-1.5"
                  >
                    {shareSavedToast ? (
                      <span>✓ Сохранено</span>
                    ) : (
                      <span>Сохранить в закладки</span>
                    )}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true };
      }
      componentDidCatch(error, info) {
        console.error("App error:", error, info);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-black text-white p-6 flex flex-col items-center justify-center text-center">
              <div className="w-12 h-12 rounded-full bg-rose-500/20 text-rose-500 flex items-center justify-center mb-3">
                <svg className="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              </div>
              <h2 className="text-[16px] font-bold mb-1">Произошла ошибка</h2>
              <p className="text-[12px] text-[#8E8E93] max-w-xs mb-4">Нажмите кнопку ниже, чтобы перезапустить интерфейс.</p>
              <button
                onClick={() => { localStorage.clear(); window.location.reload(); }}
                className="px-4 py-2 rounded-[10px] bg-[#0A84FF] text-white font-semibold text-[12px]"
              >
                Перезагрузить приложение
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
